crate_name:
  default: "{{ _copier_conf.dst_path.name }}"

project_title:
  default: "{{ crate_name }}"

crate_description:
  default: "{{ project_title }}"

project_kind:
  type: str
  default: "cli"
  choices:
    - "cli"
    - "webapp"

release_mode:
  type: str
  default: "binaries"
  choices:
    - "binaries"
    - "dockerized"

repository:
  default: ""
